<!DOCTYPE html>
<html>
    <head>
        <script src = "https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
        </script>
        <script>
        $(document).ready(function(){
        $("#hide").click(function(){
        $("p").hide();
        });

        $("#show").click(function(){
        $("p").show();
        });
    });
</script>
<body>
    <h1>Hide and Show Elements</h1>
        <p> My name is shiven</p>
        <button id="hide">Hide</button>
        <button id="show">Show</button>
</body>
</head>
</html>
