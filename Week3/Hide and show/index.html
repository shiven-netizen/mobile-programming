<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hide and Show</title>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script>
        $(document).ready(function(){
            $("#hide").click(function(){
                $("p").hide();
            });

            $("#show").click(function(){
                $("p").show();
            });
        });
    </script>
</head>
<body>

    <h1>Hello, My Name is Shiven </h1>
    
    <p>This is a paragraph that you can hide or show!</p>

    <button id="hide">Hide Paragraph</button>
    <button id="show">Show Paragraph</button>

</body>
</html>
