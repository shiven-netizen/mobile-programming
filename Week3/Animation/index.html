<!DOCTYPE html>
<html>
    <head>
        <title>Animation</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function() {
            $("button").click(function() {
            var div = $("div");
                div.css("background", "blue");
                div.animate({top: '400px', height: '300px', width: '300px', opacity: '0.4'}, "slow");
                div.animate({left: '400px', height: '300px', width: '300px', opacity: '0.8'}, "slow");
                div.animate({top: '50px', height: '300px', width: '300px', opacity: '0.4'}, "slow");
                div.animate({left: '0px', height: '100px', width: '100px', opacity: '1'}, "slow");
                    });
                });
        </script>
    </head>
<body>
    <button>Start Animation</button>
<div style="background:#98bf21;height:100px;width:100px;position:absolute;">
    hello world
</div>
</body>
</html>
